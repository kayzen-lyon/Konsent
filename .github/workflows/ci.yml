name: CI

# Le PRD §20 classe « faux positifs décrédibilisants » en probabilité élevée et
# impact fort, et désigne les fixtures en CI comme mitigation n°1. Le dépôt a
# vécu neuf commits sans aucune CI : cette mitigation n'existait pas.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Intégrité du référentiel : unicité des identifiants, effectifs par
      # famille conformes au PRD, et surtout — aucune règle statique sans
      # détecteur ni déclaration explicite d'indécidabilité.
      - name: Contrôles du rulepack
        run: npm run check:rulepack

      # La CSP de production ne doit jamais hériter du `unsafe-eval` concédé
      # au serveur de développement.
      - name: Contrôle de la CSP
        run: npm run check:csp

      # Le produit fait de l'hébergement européen un argument commercial. Il
      # doit donc s'y tenir lui-même.
      - name: Cohérence de souveraineté
        run: npm run check:sovereignty

      - name: Typage
        run: npm run typecheck

      # Chaque règle doit avoir un cas positif et un cas négatif reproductibles
      # (PRD §6.1 et différenciateur n°27).
      # Deux faux positifs trouves en auditant Konsent avec Konsent.
      - name: Extraction HTML
        run: npm run test:html

      - name: Fixtures du moteur
        run: npm run test:fixtures

      # Le décodeur TCF manipule une pièce à conviction : aller-retour
      # d'encodage, et robustesse aux chaînes abîmées.
      - name: Décodeur TCF
        run: npm run test:tcf

      # La couche multi-juridiction ne doit jamais faire disparaître une règle
      # sans motif, ni annoncer comme qualifié ce qui ne l'est pas.
      - name: Couche multi-juridiction
        run: npm run test:jurisdictions

      # Signature du webhook — le seul endroit du produit où une erreur de
      # comparaison de chaînes coûte de l'argent — et sincérité de la grille.
      - name: Facturation
        run: npm run test:billing

      # Jetons stockés en empreinte seulement, RLS sans politique permissive,
      # fonction SECURITY DEFINER hors de portée du rôle anonyme.
      - name: Comptes
        run: npm run test:accounts

      # Schemas exploitables par un agent, refus explicites, et garde-fous
      # transmis par les prompts.
      - name: Serveur MCP
        run: npm run test:mcp

      - name: Build
        run: npm run build

  # Analyse statique : préréglages Next (core-web-vitals + typescript).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  # Contrastes WCAG des jetons de couleur (clair, sombre, contraste renforcé).
  # Le script ne dépend que de Node : pas d'installation des dépendances.
  contrastes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Contrastes des jetons
        run: npm run check:contrast

  # Parcours clés et axe-core (WCAG 2.1 AA) sur le build de production.
  # Playwright lance lui-même `npm run start` sur le port 3100 (webServer
  # de playwright.config.ts) et attend qu'il réponde.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Installer Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dépendances système de Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build
        run: npm run build

      - name: Playwright
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
