name: Auto-fusion Dependabot (correctifs)

# Active la fusion automatique (squash) des PR Dependabot dont TOUTES les
# mises à jour sont des correctifs semver (x.y.Z). La fusion n'a lieu
# qu'une fois les vérifications obligatoires de la branche passées : la
# protection de `main` doit exiger les jobs de la CI, et l'option « Allow
# auto-merge » doit être activée dans les réglages du dépôt.
#
# Rien d'autre n'est fusionné automatiquement : ni les mineures, ni les
# majeures, ni aucune PR qui n'est pas ouverte par Dependabot.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    steps:
      - name: Métadonnées Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activer l'auto-fusion (correctif uniquement)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
